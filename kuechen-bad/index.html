<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Bobos Was gehört wohin?</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main class="game" aria-labelledby="game-title">
    <h1 id="game-title" class="sr-only">Was gehört wohin?</h1>

    <section class="hero" aria-label="Bobo und Aufgabe">
      <button class="bobo-button" id="boboButton" type="button" aria-label="Bobo nennt den Gegenstand noch einmal">
        <img src="../farbenspiel/bobo.webp?v=8" alt="Bobo" class="bobo">
      </button>

      <button class="speech-bubble" id="speechButton" type="button" aria-label="Gegenstand vorlesen">
        <span class="speaker" aria-hidden="true">🔊</span>
        <span id="instructionText">Wohin gehört das?</span>
      </button>
    </section>

    <section class="board" aria-label="Spielfeld">
      <div class="dropzone" id="zoneKueche" data-zone="kueche">
        <img src="01_kueche.png" alt="" class="zone-bg">
        <span class="zone-label">Küche</span>
      </div>

      <div
        class="item"
        id="item"
        role="button"
        tabindex="0"
        aria-label="Gegenstand, zum Wiederholen antippen"
      ></div>

      <div class="dropzone" id="zoneBad" data-zone="bad">
        <img src="02_badezimmer.png" alt="" class="zone-bg">
        <span class="zone-label">Bad</span>
      </div>
    </section>

    <section class="feedback" aria-live="polite" aria-atomic="true">
      <div id="feedbackIcon" class="feedback-icon" aria-hidden="true"></div>
      <div>
        <div id="feedbackTitle" class="feedback-title"></div>
        <div id="feedbackText" class="feedback-text"></div>
      </div>
    </section>

    <p class="hint">Ziehe den Gegenstand in die Küche oder ins Bad. Auf Bobo oder die Sprechblase tippen, um ihn noch einmal zu hören.</p>
    <a href="../index.html" class="home-link">← Zur Spieleübersicht</a>
  </main>

  <script src="script.js?v=1"></script>
</body>
</html>
