<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f7f7f5">
  <title>Bobos Wo gehört das hin?</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="game" aria-labelledby="game-title">
    <h1 id="game-title" class="sr-only">Wo gehört das hin?</h1>

    <section class="scene-select" id="sceneSelect" aria-label="Szenerien auswählen">
      <p class="select-title">Welche zwei Szenerien möchtest du vergleichen?</p>
      <div class="scene-grid" id="sceneGrid"></div>
      <button class="start-button" id="startButton" type="button" disabled>Los geht's!</button>
    </section>

    <section class="hero" aria-label="Bobo und Aufgabe">
      <button class="bobo-button" id="boboButton" type="button" aria-label="Bobo nennt den Gegenstand noch einmal">
        <img src="../farbenspiel/bobo.webp?v=8" alt="Bobo" class="bobo">
      </button>

      <button class="speech-bubble" id="speechButton" type="button" aria-label="Gegenstand vorlesen">
        <span class="speaker" aria-hidden="true">🔊</span>
        <span id="instructionText">Wohin gehört das?</span>
      </button>
    </section>

    <section class="board" aria-label="Spielfeld">
      <div class="dropzone" id="zoneA" data-zone="a">
        <img id="zoneAImg" src="" alt="" class="zone-bg">
        <span id="zoneALabel" class="zone-label"></span>
      </div>

      <div
        class="item"
        id="item"
        role="button"
        tabindex="0"
        aria-label="Gegenstand, zum Wiederholen antippen"
      ></div>

      <div class="dropzone" id="zoneB" data-zone="b">
        <img id="zoneBImg" src="" alt="" class="zone-bg">
        <span id="zoneBLabel" class="zone-label"></span>
      </div>
    </section>

    <section class="feedback" aria-live="polite" aria-atomic="true">
      <div id="feedbackIcon" class="feedback-icon" aria-hidden="true"></div>
      <div>
        <div id="feedbackTitle" class="feedback-title"></div>
        <div id="feedbackText" class="feedback-text"></div>
      </div>
    </section>

    <p class="hint">Ziehe den Gegenstand in die richtige Szenerie. Auf Bobo oder die Sprechblase tippen, um ihn noch einmal zu hören.</p>
    <button class="change-scenes" id="changeScenesButton" type="button">Szenerien wechseln</button>
    <a href="../index.html" class="home-link">← Zur Spieleübersicht</a>
  </main>

  <script src="script.js?v=2"></script>
</body>
</html>
