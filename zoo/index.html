<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#7ec850">
  <title>Bobos Zoo</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="zoo" aria-label="Bobos Zoo">
    <section class="meadow" id="meadow" aria-label="Deine Zoo-Wiese">
      <div class="sky" aria-hidden="true">
        <span class="sun">☀️</span>
        <span class="cloud cloud-1">☁️</span>
        <span class="cloud cloud-2">☁️</span>
      </div>
      <div class="objects-layer" id="objectsLayer"></div>
      <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
    </section>

    <div class="celebrate-layer" id="celebrateLayer" aria-hidden="true"></div>

    <div class="tray" id="tray" hidden>
      <button class="tray-close" id="trayClose" type="button" aria-label="Auswahl schließen">✕</button>
      <div class="tray-cards" id="trayCards"></div>
    </div>

    <nav class="category-bar" id="categoryBar" aria-label="Auswahl"></nav>

    <button class="parent-gear" id="parentGear" type="button" aria-label="Elternbereich (gedrückt halten)">⚙️</button>

    <a href="../index.html" class="home-link">← Zur Spieleübersicht</a>
  </main>

  <div class="parent-overlay" id="parentOverlay" hidden>
    <div class="parent-panel">
      <h2>Für Eltern</h2>

      <label class="switch-row">
        <span>🔊 Geräusche</span>
        <input type="checkbox" id="soundToggle">
      </label>

      <label class="switch-row">
        <span>🎵 Musik</span>
        <input type="checkbox" id="musicToggle">
      </label>

      <button id="resetZooBtn" class="danger-btn" type="button">Zoo zurücksetzen</button>
      <button id="closeParentBtn" class="close-btn" type="button">Schließen</button>
    </div>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
